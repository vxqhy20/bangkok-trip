<style>
/* Layout: phone-first trip app. Sticky day tabs, one column of stops per day, shared ticks + notes. */
:root{

  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1716; --surface:#15221f; --ink:#e4eeeb; --muted:#9bb0ab; --line:#26332f;
  --river:#5fc2b4; --river-soft:#17332e; --gold:#f0b43c; --gold-soft:#3a2d10; --done:#5f7470; color-scheme:dark}}
:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:640px;margin:0 auto}
header{padding-block:22px 10px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}

.sync{margin-top:10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--done)}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

.tabs{display:flex;gap:6px;width:max-content}
.tab{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.15}

.tab[aria-selected="true"]{background:var(--river);border-color:var(--river);color:var(--bg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.8}
.tab:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.day-head{padding-block:18px 6px}
.day-head h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1.15;text-wrap:balance}
.day-head p{margin:6px 0 0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--river-soft);color:var(--river);font-weight:600}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.alert{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--gold-soft);color:var(--ink);font-size:14.5px}
.alert b{color:var(--gold)}
ol.stops{list-style:none;margin:14px 0 0;padding:0;position:relative}
ol.stops::before{content:"";position:absolute;left:44px;top:8px;bottom:8px;width:2px;background:var(--line)}
.stop{display:grid;grid-template-columns:52px 1fr;gap:12px;padding-block:8px}
.time{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:14px;position:relative}
.time::after{content:"";position:absolute;right:-13px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--river)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card-top{display:flex;gap:12px;align-items:center}

.stop.done h3{text-decoration:line-through;color:var(--done)}

.check:checked{background:var(--river)}
.check:checked::after{content:"";width:7px;height:12px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}

.card p{margin:6px 0 0;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.map{font-size:14px;font-weight:600;color:var(--river);text-decoration:none;border:1px solid var(--river);border-radius:8px;padding:5px 10px}

.thumb{width:56px;height:56px;flex:none;border-radius:10px;background:var(--river-soft);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:44px;height:44px;display:block}
.thumb .s{fill:none;stroke:var(--river);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.thumb .f2{fill:var(--river);stroke:none;opacity:.25}
.stop.done .thumb{opacity:.55}

.leg-text{min-width:0;overflow-wrap:anywhere}
.leg-mode{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.leg-mode.grab,.leg-mode.car{border-color:var(--river);color:var(--river)}

.opts span{color:var(--muted)}

.deal{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--gold-soft);color:var(--ink);text-decoration:none;font-size:14px}
.deal b{font-weight:600}
.deal span{font-family:var(--mono);font-size:12.5px;color:var(--gold)}
.deal:hover{outline:1px solid var(--gold)}
.photos{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.note-btn{font:inherit;font-size:14px;background:none;border:none;color:var(--muted);cursor:pointer;padding:5px 4px;text-decoration:underline;text-underline-offset:3px}
.note-view{margin-top:8px;font-size:14px;background:var(--gold-soft);border-radius:8px;padding:6px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-edit{margin-top:8px;display:grid;gap:6px}
textarea{font:inherit;font-size:15px;width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.box h4{margin:0 0 4px;font-size:16px}

.cl-sec>summary::-webkit-details-marker{display:none}

.cl-count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cl-sec>summary::after{content:"▾";color:var(--muted);font-size:13px}

.cl-txt{min-width:0;display:flex;flex-direction:column}
.cl-n{font-weight:600;font-size:15px;line-height:1.3}
.cl-d{font-size:13px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}

    const hasOpts = s.opts && s.opts.length;
    if (base && (!hasOpts || icon === "market" || icon === "temple" || icon === "house" || icon === "festival" || icon === "view")) {
      const raw = s.n.replace(/^(Breakfast|Lunch|Dinner|Brunch): /,"");
      const c0 = (raw in CL_CAT || s.n in CL_CAT) ? (CL_CAT[s.n] ?? CL_CAT[raw]) : base;
      const nm = CL_NAME[s.n] || raw;
      if (c0 && !seen.has(nm)) { seen.add(nm); cats[c0].push({id:s.id, n:nm, d:"", day:day.tab, map:s.map}); }
    }
    (s.opts||[]).forEach(o => {
      if (o.g === "Where things are") return;
      let c;
      if (o.g && FOOD_G.test(o.g)) c = "food";
      else if (o.g && SHOP_G.test(o.g)) c = "shop";
      else if (o.g === "Explore" || o.g === "On the way") c = DO_RE.test(o.n+" "+(o.d||"")) || !FOOD_RE.test(o.n+" "+(o.d||"")) ? "do" : "food";
      else {
        const t = o.n+" "+(o.d||"");
        c = DO_RE.test(t) ? "do" : SHOP_RE.test(t) ? "shop" : FOOD_RE.test(t) ? "food" : (base || "do");
      }
      if (o.n in CL_CAT) c = CL_CAT[o.n];
      if (!c) return;
      const nm = CL_NAME[o.n] || o.n;
      if (seen.has(nm)) return; seen.add(nm);
      cats[c].push({id:"o-"+s.id+"-"+slug(o.n), n:nm, d:o.d||"", day:day.tab, map:o.map||o.n});
    });
  }));
  return cats;
}
const CHECKLIST = buildChecklist();
const CL_META = [
  ["dish","Must-try dishes","eat"],
  ["food","Food and drink spots","eat"],
  ["shop","Shopping and gifts","shop"],
  ["do","Places and things to do","photo"],
];
const clOpen = new Set(["dish"]);
function checklistHTML(){
  const all = CL_META.map(([k]) => CHECKLIST[k]).flat();
  const doneAll = all.filter(x => state[x.id]?.done).length;
  const secs = CL_META.map(([k,title,ic]) => {
    const items = CHECKLIST[k]; const done = items.filter(x => state[x.id]?.done).length;
    const rows = items.map(x => {
      const st = state[x.id] || {};
      return `<li class="cl-row ${st.done?"done":""}">
        <input type="checkbox" class="check cl-check" data-id="${x.id}" ${st.done?"checked":""} ${canWrite?"":"disabled"} aria-label="Done: ${esc(x.n)}">
        <div class="cl-txt"><span class="cl-n">${esc(x.n)}</span>${x.d?`<span class="cl-d">${esc(x.d)}</span>`:""}</div>
        <span class="cl-day">${esc(x.day)}</span>
        ${x.map?`<a class="cl-map" href="${q(x.map)}" target="_blank" rel="noopener" aria-label="Map: ${esc(x.n)}">${BI.pin}</a>`:""}
      </li>`;
    }).join("");
    return `<details class="cl-sec" data-cl="${k}" ${clOpen.has(k)?"open":""}>
      <summary><span class="cl-ic">${BI[ic]}</span><span class="cl-title">${esc(title)}</span><span class="cl-count">${done}/${items.length}</span></summary>
      <ul class="cl-list">${rows}</ul></details>`;
  }).join("");
  return `<section class="info">
    <h2>Checklist</h2>
    <p class="cl-sub">Everything in the plan in one list. Ticks sync with the day tabs and with your friend. ${doneAll}/${all.length} done.</p>
    ${secs}
  </section>`;
}
let active = "d1";
try { const s = localStorage.getItem("bkk-tab"); if (s) active = s; } catch(e){}
if (TODAY_ID) active = TODAY_ID;

let state = {};       // stopId -> {done, note}
try {
  const saved = localStorage.getItem("bkk-state");
  if (saved) state = JSON.parse(saved);
} catch(e){}

// Import progress from URL query (?progress=...) if shared
try {
  const params = new URLSearchParams(window.location.search);
  const shared = params.get("progress");
  if (shared) {
    const jsonStr = decodeURIComponent(escape(atob(shared)));
    const parsed = JSON.parse(jsonStr);
    if (parsed && typeof parsed === "object") {
      state = { ...state, ...parsed };
      localStorage.setItem("bkk-state", JSON.stringify(state));
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }
} catch(e){}

let db = null;
let canWrite = true;
let editing = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderTabs(){
  const all = [...DAYS, ...INFO_TABS];
  $("#tabs").innerHTML = all.map(d => {
    let sub = d.date;
    if (d.id === "stay"){ const all = Object.values(CHECKLIST).flat(); const n = all.filter(x => state[x.id]?.done).length; sub = n + "/" + all.length; }
    if (d.stops){
      const n = d.stops.filter(s => state[s.id]?.done).length;
      if (n) sub += " · " + n + "/" + d.stops.length;
    }
    return `<button class="tab" role="tab" id="tab-${d.id}" aria-selected="${d.id===active}" data-id="${d.id}">${esc(d.tab)}<small>${esc(sub)}</small></button>`;
  }).join("");
}

function renderPanel(){
  if (active === "stay"){ $("#panel").innerHTML = checklistHTML() + STAY_HTML; return; }
  if (active === "tips"){ $("#panel").innerHTML = TIPS_HTML; return; }
  const day = DAYS.find(d => d.id === active) || DAYS[0];
  const nextId = day.id === TODAY_ID ? (day.stops.find(x => !state[x.id]?.done)||{}).id : null;
  const stops = day.stops.map(s => {
    const st = state[s.id] || {};
    const isNext = s.id === nextId;
    const tags = [];
    (s.tags||[]).forEach(t => tags.push(`<span class="tag ${t.startsWith("@")?"creator":""}">${esc(t)}</span>`));
    const isEditing = editing === s.id;
    const g = GO[s.id];
    return (g?`<li class="leg"><span class="leg-mode ${g[0]}">${BI[LEG_ICON[g[0]]]||""}${GO_LABEL[g[0]]}</span><span class="leg-text">${esc(g[1])}</span></li>`:"") + `<li class="stop ${st.done?"done":""} ${isNext?"next":""}" id="stop-${s.id}">
      <div class="time">${esc(s.t)}</div>
      <div class="card">
        <div class="card-top">
          ${thumb(s.id)}
          <div class="ttl">${isNext?`<span class="badge-next">Next</span>`:""}<h3>${esc(s.n)}</h3></div>
          <input type="checkbox" class="check" id="chk-${s.id}" data-id="${s.id}" ${st.done?"checked":""} ${canWrite?"":"disabled"} aria-label="Done: ${esc(s.n)}">
        </div>
        ${bullets([...(s.b||[]), ...(s.cost && !(s.b||[]).some(x=>x[0]==="price") ? [["price", s.cost]] : [])])}
        ${optsHTML(s)}
        ${tags.length?`<div class="tags">${tags.join("")}</div>`:""}
        ${s.deal?`<div class="deals">${s.deal.map(x=>`<a class="deal" href="${x.url}" target="_blank" rel="noopener"><b>${esc(x.label)}</b><span>${esc(x.price)}</span></a>`).join("")}</div>`:""}
        ${st.note && !isEditing ? `<div class="note-view">${esc(st.note)}</div>`:""}
        ${isEditing ? `<div class="note-edit">
            <textarea id="note-${s.id}" placeholder="e.g. closed today, try the mango sticky rice here">${esc(st.note||"")}</textarea>
            <div class="row"><button class="btn" data-cancel="${s.id}">Cancel</button><button class="btn primary" data-save="${s.id}">Save note</button></div>
          </div>`:""}
        <div class="actions">
          <a class="map" href="${q(s.map)}" target="_blank" rel="noopener">Map</a>
          <a class="photos" href="${photos(s.map)}" target="_blank" rel="noopener">Photos</a>
          ${canWrite && !isEditing ? `<button class="note-btn" data-note="${s.id}">${st.note?"Edit note":"Add note"}</button>`:""}
        </div>
      </div>
    </li>`;
  }).join("");
  $("#panel").innerHTML = `
    <div class="day-head">
      <h2>${esc(day.title)}</h2>
      ${day.alert?`<div class="alert">${esc(day.alert)}</div>`:""}
      <ol class="outline" aria-label="Day at a glance">${day.stops.map(x => `<li class="${state[x.id]?.done?"done":""} ${x.id===nextId?"next":""}"><a href="#stop-${x.id}" data-jump="${x.id}"><span class="ot">${esc(x.t)}</span><span class="on">${esc(x.n.replace(/^(Breakfast|Lunch|Dinner|Brunch|Check in|Check out|Sunset ride|Dessert): /i,""))}</span></a></li>`).join("")}</ol>
    </div>
    <ol class="stops">${stops}</ol>`;
  if (editing){ const ta = document.getElementById("note-"+editing); if (ta) ta.focus(); }
}

function render(){ renderTabs(); renderPanel(); }

function setSync(on, text){
  $("#syncDot").classList.toggle("on", on);
  $("#syncText").textContent = text;
}

async function write(id, patch){
  const next = { ...(state[id]||{}), ...patch };
  state[id] = next;
  try { localStorage.setItem("bkk-state", JSON.stringify(state)); } catch(e){}
  render();
  if (!db){ setSync(true, "Saved on device"); return; }
  try { await db.doc("stops/"+id).set({ done: !!next.done, note: next.note || "" }); }
  catch(e){
    if (e && e.code === "invalid_argument"){ canWrite = false; setSync(true, "View only. Ask the trip owner for edit access to tick stops."); render(); }
    else setSync(false, "Couldn't save. Check your connection and try again.");
  }
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (tab){ active = tab.dataset.id; editing = null; try{localStorage.setItem("bkk-tab",active)}catch(_){ } render(); window.scrollTo({top:0}); return; }
  const j = e.target.closest("[data-jump]");
  if (j){ e.preventDefault(); const el = document.getElementById("stop-"+j.dataset.jump); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); return; }
  const n = e.target.closest("[data-note]");
  if (n){ editing = n.dataset.note; renderPanel(); return; }
  const c = e.target.closest("[data-cancel]");
  if (c){ editing = null; renderPanel(); return; }
  const s = e.target.closest("[data-save]");
  if (s){ const id = s.dataset.save; const v = document.getElementById("note-"+id).value.trim(); editing = null; write(id, { note: v }); return; }
});
document.addEventListener("change", (e) => {
  if (e.target.classList.contains("check")) write(e.target.dataset.id, { done: e.target.checked });
});

document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (d && d.matches && d.matches("details[data-opts]")) { d.open ? openOpts.add(d.dataset.opts) : openOpts.delete(d.dataset.opts); }
  if (d && d.matches && d.matches("details[data-cl]")) { d.open ? clOpen.add(d.dataset.cl) : clOpen.delete(d.dataset.cl); }
}, true);

render();

document.addEventListener("click", (e) => {
  if (e.target && e.target.id === "btnShareProgress") {
    try {
      const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
      const shareUrl = window.location.origin + window.location.pathname + "?progress=" + dataStr;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert("Link with your checked items copied to clipboard! Send it to your friend to sync your progress.");
        });
      } else {
        prompt("Copy this link to send your progress to your friend:", shareUrl);
      }
    } catch(err) {
      alert("Could not generate share link.");
    }
  }
});

(async () => {
  try {
    db = await (window.claude?.use ? window.claude.use("db") : null);
  } catch(e){ db = null; }
  if (!db){
    const hasSaved = Object.keys(state).length > 0;
    setSync(true, hasSaved ? "Saved on device" : "Ready");
    return;
  }
  db.collection("stops").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data() || {}; next[d.id] = { done: !!v.done, note: v.note || "" }; });
    state = next;
    try { localStorage.setItem("bkk-state", JSON.stringify(state)); } catch(e){}
    setSync(true, "Synced");
    if (!editing) render(); else renderTabs();
  }, () => setSync(false, "Lost connection to the shared checklist. Reload to reconnect."));
})();
</script>
